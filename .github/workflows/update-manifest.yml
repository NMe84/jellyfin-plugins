name: Update Manifest

on:
  repository_dispatch:
    types: [ plugin-released ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Merge plugin manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          # Read each plugin manifest through the GitHub API rather than
          # raw.githubusercontent.com.  The raw host is CDN-cached for several
          # minutes and serves inconsistently across edge nodes, so a release that
          # fires this workflow immediately could otherwise merge a stale copy and
          # silently roll the aggregated manifest back.
          PLUGINS = [
            ("NMe84", "jellyfin-watch-state-sync-plugin"),
            ("NMe84", "jellyfin-wled-tv-plugin"),
          ]

          token = os.environ.get("GH_TOKEN")
          headers = {
            "Accept": "application/vnd.github.raw+json",
            "User-Agent": "jellyfin-plugins-aggregator",
          }
          if token:
            headers["Authorization"] = f"Bearer {token}"

          merged = []
          failed = []
          for owner, repo in PLUGINS:
            url = f"https://api.github.com/repos/{owner}/{repo}/contents/manifest.json?ref=gh-pages"
            try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                plugins = json.loads(r.read())
              merged.extend(plugins)
              for p in plugins:
                versions = ", ".join(v.get("version", "?") for v in p.get("versions", [])[:4])
                print(f"{repo}: {p.get('name')} -> {versions}")
            except Exception as e:
              failed.append(f"{repo}: {e}")

          # Never publish a partial catalogue - a failed fetch would drop a plugin.
          if failed:
            raise SystemExit("Aborting, could not fetch: " + "; ".join(failed))

          with open("manifest.json", "w") as f:
            json.dump(merged, f, indent=2)

          print(f"Wrote {len(merged)} plugin(s) to manifest.json")
          EOF

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Update aggregated manifest"
          git push
